name: OSV-Scanner

on:
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      contents: read
      security-events: write
    with:
      fail-on-vuln: false
